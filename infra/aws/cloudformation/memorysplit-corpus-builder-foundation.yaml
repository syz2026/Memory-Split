      SecurityGroupIds:
        - Fn::GetAtt:
            - EndpointSecurityGroup
            - GroupId
      ServiceName:
        Fn::Sub: com.amazonaws.${AWS::Region}.kms
      SubnetIds:
        - Ref: PrivateSubnet
      VpcEndpointType: Interface
      VpcId:
        Ref: Vpc

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      PrivateDnsEnabled: true
      SecurityGroupIds:
        - Fn::GetAtt:
            - EndpointSecurityGroup
            - GroupId
      ServiceName:
        Fn::Sub: com.amazonaws.${AWS::Region}.logs
      SubnetIds:
        - Ref: PrivateSubnet
      VpcEndpointType: Interface
      VpcId:
        Ref: Vpc

  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      PrivateDnsEnabled: true
      SecurityGroupIds:
        - Fn::GetAtt:
            - EndpointSecurityGroup
            - GroupId
      ServiceName:
        Fn::Sub: com.amazonaws.${AWS::Region}.ssm
      SubnetIds:
        - Ref: PrivateSubnet
      VpcEndpointType: Interface
      VpcId:
        Ref: Vpc

  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      PrivateDnsEnabled: true
      SecurityGroupIds:
        - Fn::GetAtt:
            - EndpointSecurityGroup
            - GroupId
      ServiceName:
        Fn::Sub: com.amazonaws.${AWS::Region}.ssmmessages
      SubnetIds:
        - Ref: PrivateSubnet
      VpcEndpointType: Interface
      VpcId:
        Ref: Vpc

  StsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      PrivateDnsEnabled: true
      SecurityGroupIds:
        - Fn::GetAtt:
            - EndpointSecurityGroup
            - GroupId
      ServiceName:
        Fn::Sub: com.amazonaws.${AWS::Region}.sts
      SubnetIds:
        - Ref: PrivateSubnet
      VpcEndpointType: Interface
      VpcId:
        Ref: Vpc

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetLimit:
          Amount: 200
          Unit: USD
        BudgetName:
          Fn::Sub: ${AWS::StackName}-corpus-builder-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address:
                Ref: BudgetAlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address:
                Ref: BudgetAlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address:
                Ref: BudgetAlertEmail
              SubscriptionType: EMAIL

Outputs:
  ArtifactBucketName:
    Description: Retained versioned SSE-KMS corpus bucket name.
    Value:
      Ref: ArtifactBucket
  BuilderInstanceProfileArn:
    Description: Corpus-builder instance profile ARN.
    Value:
      Fn::GetAtt:
        - BuilderInstanceProfile
        - Arn
  BuilderRoleArn:
    Description: Corpus-builder instance role ARN.
    Value:
      Fn::GetAtt:
        - BuilderRole
        - Arn
  ControllerRoleArn:
    Description: Separately assumed builder-controller role ARN.
    Value:
      Fn::GetAtt:
        - ControllerRole
        - Arn
  DataKeyArn:
    Description: Symmetric retained data KMS key ARN.
    Value:
      Fn::GetAtt:
        - DataKey
        - Arn
  LaunchTemplateId:
    Description: No-instance i4i.16xlarge launch template ID.
    Value:
      Ref: BuilderLaunchTemplate
  LaunchTemplateVersion:
    Description: Explicit latest launch template version number.
    Value:
      Fn::GetAtt:
        - BuilderLaunchTemplate
        - LatestVersionNumber
  PrivateSubnetId:
    Description: Private subnet ID approved for builder launches.
    Value:
      Ref: PrivateSubnet
  SecurityGroupId:
    Description: Zero-ingress builder security group ID.
    Value:
      Fn::GetAtt:
        - BuilderSecurityGroup
        - GroupId
  SsmDocumentName:
    Description: Immutable corpus-builder SSM command document name.
    Value:
      Ref: BuilderCommandDocument
  VpcId:
    Description: Private corpus-builder VPC ID.
    Value:
      Ref: Vpc
