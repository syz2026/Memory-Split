      - protected_cohort_complete
      - primary_exact_p_lte_0.05
      - primary_95pct_interval_strictly_above_zero
      - validity_gates_pass
      - positive_provider_specific_mean_deltas
  supports_practical_null:
    requires:
      - protected_cohort_complete
      - validity_gates_pass
      - primary_90pct_interval_strictly_inside_plus_or_minus_0.01
  inconclusive: all_valid_results_meeting_neither_claim_rule
  invalid: measured_protocol_or_provenance_failure
power_sensitivity:
  status: preregistered_fixed_n
  n_pairs: 10
  planning_effect_absolute_accuracy: 0.02
  planning_paired_seed_sd: 0.02
  approximate_power: 0.80
  caveat: >-
    This planning sensitivity is conditional, not a guarantee. Prospective
    power of 0.90 or greater may not be claimed without independent pilot
    evidence frozen before protected outcomes are inspected.
reporting_constraints:
