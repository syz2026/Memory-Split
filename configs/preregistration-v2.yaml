schema_version: 2
preregistration_id: memorysplit-confirmatory-v2
frozen: true
current_scientific_status: incomplete
current_interim_evidence_label: none
protected_launch_allowed: false
canonical_hypothesis: >-
  At matched parameters, initialization, raw tokens, token order, optimizer
  schedule and inference budget, removing direct next-token loss from selected
  factual payloads improves OOD relational reasoning.

status_policy:
  scientific_status:
    values:
      - incomplete
      - invalid
      - complete
    rules:
      incomplete: missing_required_runs_evaluations_instruments_or_replication
      invalid: measured_protocol_provenance_endpoint_or_instrument_failure
      complete: terminal_evidence_complete_and_no_measured_validity_failure
    resolution: measured_failure_invalid_else_missing_terminal_evidence_incomplete_else_complete
  interim_evidence_label:
    values:
      - none
      - directional_only
      - sign_consistent_only
    rules:
      none: no_valid_interim_seed_bundle_evidence
      directional_only: exactly_one_valid_360m_pair
      sign_consistent_only: three_same_sign_pairs_without_completed_confirmatory_test
  final_inference_conclusion:
    values:
      - not_evaluated
      - inconclusive
      - supports_effect
      - supports_practical_null
    rules:
      not_evaluated: scientific_status_not_complete
      inconclusive: complete_valid_primary_procedure_crosses_neither_effect_nor_equivalence
      supports_effect: narrow_primary_omnibus_passes_and_all_validity_guardrail_gates_pass
      supports_practical_null: narrow_primary_omnibus_meets_frozen_equivalence_rule
  forbidden_labels:
    - failed_to_reject
    - statistically_significant_single_seed
    - reasoning_optimal_sprint

protected_cohort:
  condition_pair:
    - dense
    - split90
  model_parameters: 356033536
  terminal_n_pairs: 5
  seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
  precommit_before_seed0_unblinding: true
  continue_after_seed0_regardless_of_effect: true
  continuation_may_stop_only_for:
    - measured_validity_failure
    - infrastructure_failure
  seed0:
    scientific_status_after_valid_completion: incomplete
    interim_evidence_label: directional_only
    completion_label: 1/5
    retained_in_terminal_cohort: true
    stop_only_for_validity_or_infrastructure_failure: true
  training:
    nominal_tokens_per_parameter: 20
    targets_per_update: 524288
    optimizer_steps: 13582
    raw_target_tokens: 7120879616
  matched_pair_invariants:
    - model_architecture
    - parameters
    - initialization
    - data_seed
    - raw_target_tokens
    - token_bytes
    - token_order
    - packing_boundaries
    - optimizer
    - optimizer_schedule
    - targets_per_update
    - training_steps
    - inference_budget
    - evaluation_items
    - exact_graph_memory
  claim_bearing_difference: direct_target_weights_on_routed_factual_payloads
  memory:
    kind: exact_non_trainable_graph
    identical_between_arms: true
    byte_identity_required: true
    answer_or_proof_generation_forbidden: true
  seed0_allocation:
    accelerator: A100_80GB
    total_gpus: 7
    dense_training_gpus:
      - 0
      - 1
      - 2
    split_training_gpus:
      - 3
      - 4
      - 5
    evaluation_verification_gpus:
      - 6
    symmetric_training: true
    four_vs_three_training_forbidden: true

development_diagnostics_29m:
  required: true
  run_count: 6
  model_parameters: 28969216
  targets_per_update: 524288
  optimizer_steps: 1106
  raw_target_tokens: 579862528
  protected_launch_requires_all_pass: true
  selection_use_forbidden: true
  runs:
    - id: full_corpus_dense
      pair_id: full_corpus
      arm: dense
      token_matched_replacement: none
      state: pending
    - id: full_corpus_split90
      pair_id: full_corpus
      arm: split90
      token_matched_replacement: none
      state: pending
    - id: no_arc_conceptarc_dense
      pair_id: no_arc_conceptarc
      arm: dense
      token_matched_replacement: fineweb_edu
      state: pending
    - id: no_arc_conceptarc_split90
      pair_id: no_arc_conceptarc
      arm: split90
      token_matched_replacement: fineweb_edu
      state: pending
    - id: no_refinement_dense
      pair_id: no_refinement
      arm: dense
      token_matched_replacement: verified_standard_relational_records
      state: pending
    - id: no_refinement_split90
      pair_id: no_refinement
      arm: split90
      token_matched_replacement: verified_standard_relational_records
      state: pending

intervention_gates:
  minimum_offload_percent:
    distinct_offloadable_atomic_facts: 90.0
    train_only_information_weighted_burden: 90.0
  semantic_mask_closure_required: true
  rules_operators_schemas_and_proof_procedures_internal: true
  random_fact_and_matched_nonfactual_controls_required: true

evaluation:
  primary_endpoint: counterfactual_pair_and_proof_accuracy
  primary_contrast_id: primary_omnibus_pair_and_proof__graph_non_path__composition_joint_ood__split90_minus_dense
  verifier_required: true
  pair_credit: one_iff_both_twins_have_correct_answers_and_verifier_accepted_proofs
  reasoning_families:
    - graph
    - non_path
  model_visible_and_sealed_gold_separate: true
  stratum_classification:
    primary_ood_strata:
      - composition_ood
      - joint_ood
    secondary_strata:
      - length_ood
    guardrail_strata:
      - iid
  primary_cell_ids:
    - graph__composition_ood
    - graph__joint_ood
    - non_path__composition_ood
    - non_path__joint_ood
  primary_weighting:
    method: equal_across_four_primary_cells
    cell_weight: 0.25
    cell_ids:
      - graph__composition_ood
      - graph__joint_ood
      - non_path__composition_ood
      - non_path__joint_ood
  sealed_strata:
    - iid
    - composition_ood
    - length_ood
    - joint_ood
  required_controls:
    - correct_memory
    - memory_off
    - shuffled_returns
    - relevant_edge_swap
    - irrelevant_edge_swap
    - gold_path_replay
    - no_query
    - entity_rename
    - graph_isomorphism
    - page_order_permutation
  syntax_only_action_validation: true
  allowed_actions_may_not_be_derived_from_gold_or_store_topology: true
  fixed_action_slots: 12

analysis:
  independent_unit: paired_training_bundle
  single_primary_hypothesis: true
  primary_hypothesis:
    contrast_id: primary_omnibus_pair_and_proof__graph_non_path__composition_joint_ood__split90_minus_dense
    endpoint: counterfactual_pair_and_proof_accuracy
    estimand: split90_minus_dense
    reasoning_families:
      - graph
      - non_path
    primary_ood_strata:
      - composition_ood
      - joint_ood
    cell_ids:
      - graph__composition_ood
      - graph__joint_ood
      - non_path__composition_ood
      - non_path__joint_ood
    cell_weight: 0.25
    paired_seed_bundle_delta: split90_equal_weight_omnibus_minus_dense_equal_weight_omnibus
    test:
      method: exact_one_sided_exhaustive_sign_flip
      alpha: 0.05
      statistic: arithmetic_mean_of_paired_seed_bundle_deltas
      sign_assignments: all_2_to_n
      tail_count_rule: permuted_statistic_greater_than_or_equal_to_observed
      equality_counted: true
      zero_deltas: retained
      n_pairs: 5
      minimum_attainable_p: 0.03125
      confirmatory_scope: primary_omnibus_only
  hierarchical_bootstrap:
    draws: 20000
    resampling_levels:
      - seed
      - world
      - counterfactual_pair
  secondary_family_contrasts:
    contrast_ids:
      - secondary_graph_pair_and_proof__composition_joint_ood__split90_minus_dense
      - secondary_non_path_pair_and_proof__composition_joint_ood__split90_minus_dense
    holm:
      method: holm
      family_size: 2
      tie_break: stable_lexicographic_contrast_id_order
    required_for_n5_primary_status: false
    broader_both_families_claim:
      n5_can_establish: false
      minimum_pilot_powered_cohort_n: 6
  practical_equivalence:
    contrast_id: primary_omnibus_pair_and_proof__graph_non_path__composition_joint_ood__split90_minus_dense
    margin_absolute_pair_accuracy: 0.01
    method: two_one_sided_90_percent_confidence_bounds
    bound_estimator: hierarchical_bootstrap_seed_world_pair
    lower_rule: strictly_greater_than_negative_margin
    upper_rule: strictly_less_than_positive_margin
    boundary_equality: does_not_support_equivalence
  fixed_checkpoint_aulc:
    enabled: true
    optimizer_steps:
      - 1358
      - 3396
      - 6791
      - 10187
      - 13582
    interpolation: none
  conclusion_scope:
    supports_effect_at_n5: narrow_primary_omnibus_only
    requires_all_validity_and_guardrail_gates: true
    does_not_establish_both_families_claim: true
  effect_direction_may_not_change_continuation: true

