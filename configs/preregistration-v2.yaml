intervention_gates:
  minimum_offload_percent:
    distinct_offloadable_atomic_facts: 90.0
    train_only_information_weighted_burden: 90.0
  semantic_mask_closure_required: true
  rules_operators_schemas_and_proof_procedures_internal: true
  random_fact_and_matched_nonfactual_controls_required: true

evaluation:
  primary_endpoint: counterfactual_pair_and_proof_accuracy
  verifier_required: true
  pair_credit: one_iff_both_twins_have_correct_answers_and_verifier_accepted_proofs
  equal_weight_by:
    - reasoning_family
    - ood_stratum
  reasoning_families:
    - graph
    - non_path
  model_visible_and_sealed_gold_separate: true
  sealed_strata:
    - iid
    - composition_ood
    - length_ood
    - joint_ood
  required_controls:
    - correct_memory
    - memory_off
    - shuffled_returns
    - relevant_edge_swap
    - irrelevant_edge_swap
    - gold_path_replay
    - no_query
    - entity_rename
    - graph_isomorphism
    - page_order_permutation
  syntax_only_action_validation: true
  allowed_actions_may_not_be_derived_from_gold_or_store_topology: true
  fixed_action_slots: 12

analysis:
  independent_unit: paired_training_bundle
  hierarchical_bootstrap:
    draws: 20000
    resampling_levels:
      - seed
      - world
      - counterfactual_pair
  paired_effect_test:
    method: exact_sign_flip
    alternative: split90_greater_than_dense
  cohort_direction_test:
    method: exact_one_sided_sign_test
    n_pairs: 5
    all_positive_p: 0.03125
  three_pair_sign_consistency:
    n_pairs: 3
    all_positive_p: 0.125
    maximum_status: sign_consistent_only
  multiple_testing:
    method: holm
    family: confirmatory_primary_stratum_and_reasoning_family_contrasts
  noninferiority_and_equivalence:
    enabled: true
    margins_frozen_before_unblinding: true
    all_required_instruments_must_pass: true
  fixed_checkpoint_aulc:
    enabled: true
    checkpoints_frozen_before_unblinding: true
  effect_direction_may_not_change_continuation: true

