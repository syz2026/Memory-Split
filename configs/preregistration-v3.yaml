schema_version: 3
preregistration_id: memorysplit-confirmatory-v3
frozen: true
current_scientific_status: incomplete
current_interim_evidence_label: none
protected_launch_allowed: false
canonical_hypothesis: >-
  At matched parameters, initialization, raw tokens, token order, optimizer
  schedule and inference budget, removing direct next-token loss from selected
  factual payloads improves OOD relational reasoning.

prospective_amendment:
  supersedes: split_provider_n5_execution_plan
  execution_plan: one_aws_p5.48xlarge_n10_cohort
  outcome_inspection_before_amendment:
    seed_level_confirmatory_result_inspected: false
    arm_level_confirmatory_result_inspected: false
  continuation:
    all_ten_pairs_required: true
    effect_direction_may_not_change_continuation: true
    stop_only_for:
      - measured_preregistered_validity_failure
      - infrastructure_failure
  trained_control_arms_added: false
  claim_bearing_condition_pair:
    - dense
    - split90
  unchanged:
    - model_architecture
    - corpus_bytes
    - corpus_order
    - target_budget
    - optimizer_schedule
    - primary_endpoint
    - one_sided_direction
    - alpha
    - inclusive_tail_rule
    - validity_gates

status_policy:
  scientific_status:
    values:
      - incomplete
      - invalid
      - complete
    rules:
      incomplete: missing_required_runs_evaluations_instruments_or_replication
      invalid: measured_protocol_provenance_endpoint_or_instrument_failure
      complete: terminal_evidence_complete_and_no_measured_validity_failure
    resolution: measured_failure_invalid_else_missing_terminal_evidence_incomplete_else_complete
  interim_evidence_label:
    values:
      - none
      - directional_only
      - sign_consistent_only
    rules:
      none: no_valid_interim_seed_bundle_evidence
      directional_only: exactly_one_valid_360m_pair
      sign_consistent_only: three_same_sign_pairs_without_completed_confirmatory_test
  final_inference_conclusion:
    values:
      - not_evaluated
      - inconclusive
      - supports_effect
      - supports_practical_null
    rules:
      not_evaluated: scientific_status_not_complete
      inconclusive: complete_valid_primary_procedure_crosses_neither_effect_nor_equivalence
      supports_effect: primary_omnibus_passes_and_all_validity_guardrail_gates_pass
      supports_practical_null: primary_omnibus_meets_frozen_equivalence_rule
  forbidden_labels:
    - failed_to_reject
    - statistically_significant_single_seed
    - reasoning_optimal_sprint

protected_cohort:
  condition_pair:
    - dense
    - split90
  model_parameters: 356033536
  terminal_n_pairs: 10
  seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
