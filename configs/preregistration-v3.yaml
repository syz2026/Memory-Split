      state: pending

intervention_gates:
  minimum_offload_percent:
    distinct_offloadable_atomic_facts: 90.0
    train_only_information_weighted_burden: 90.0
  semantic_mask_closure_required: true
  rules_operators_schemas_and_proof_procedures_internal: true
  random_fact_and_matched_nonfactual_controls_required: true

evaluation:
  primary_endpoint: counterfactual_pair_and_proof_accuracy
  primary_contrast_id: primary_omnibus_pair_and_proof__graph_non_path__composition_joint_ood__split90_minus_dense
  verifier_required: true
  pair_credit: one_iff_both_twins_have_correct_answers_and_verifier_accepted_proofs
  reasoning_families:
    - graph
    - non_path
  model_visible_and_sealed_gold_separate: true
  stratum_classification:
    primary_ood_strata:
      - composition_ood
      - joint_ood
    secondary_strata:
      - length_ood
    guardrail_strata:
      - iid
  primary_cell_ids:
    - graph__composition_ood
    - graph__joint_ood
    - non_path__composition_ood
    - non_path__joint_ood
  primary_weighting:
    method: equal_across_four_primary_cells
    cell_weight: 0.25
    cell_ids:
      - graph__composition_ood
      - graph__joint_ood
      - non_path__composition_ood
      - non_path__joint_ood
  sealed_strata:
    - iid
    - composition_ood
    - length_ood
    - joint_ood
  required_controls:
    - correct_memory
    - memory_off
    - shuffled_returns
    - relevant_edge_swap
    - irrelevant_edge_swap
    - gold_path_replay
    - no_query
    - entity_rename
    - graph_isomorphism
    - page_order_permutation
  syntax_only_action_validation: true
  allowed_actions_may_not_be_derived_from_gold_or_store_topology: true
  fixed_action_slots: 12

analysis:
  independent_unit: paired_training_bundle
  single_primary_hypothesis: true
  primary_hypothesis:
    contrast_id: primary_omnibus_pair_and_proof__graph_non_path__composition_joint_ood__split90_minus_dense
    endpoint: counterfactual_pair_and_proof_accuracy
    estimand: split90_minus_dense
    timepoint: final_optimizer_step
    optimizer_step: 13582
    reasoning_families:
      - graph
      - non_path
    primary_ood_strata:
      - composition_ood
      - joint_ood
    cell_ids:
      - graph__composition_ood
      - graph__joint_ood
      - non_path__composition_ood
      - non_path__joint_ood
    cell_weight: 0.25
    paired_seed_bundle_delta: split90_equal_weight_omnibus_minus_dense_equal_weight_omnibus
    test:
      method: exact_one_sided_exhaustive_sign_flip
      alpha: 0.05
      statistic: arithmetic_mean_of_paired_seed_bundle_deltas
      sign_assignments: 1024
      tail_count_rule: permuted_statistic_greater_than_or_equal_to_observed
      equality_counted: true
      zero_deltas: retained
      n_pairs: 10
      minimum_attainable_p: 0.0009765625
      confirmatory_scope: primary_omnibus_only
  hierarchical_bootstrap:
    bit_generator: PCG64
    rng_seed: 0
    draws: 20000
    confidence_interval_percent: 90
    resampling_levels:
      - seed
      - world
      - counterfactual_pair
  secondary_family_contrasts:
    contrast_ids:
      - secondary_graph_pair_and_proof__composition_joint_ood__split90_minus_dense
      - secondary_non_path_pair_and_proof__composition_joint_ood__split90_minus_dense
    holm:
      method: holm
      family_size: 2
      tie_break: stable_lexicographic_contrast_id_order
    required_for_primary_status: false
  practical_equivalence:
    contrast_id: primary_omnibus_pair_and_proof__graph_non_path__composition_joint_ood__split90_minus_dense
    margin_absolute_pair_accuracy: 0.01
    method: two_one_sided_90_percent_confidence_bounds
    bound_estimator: hierarchical_bootstrap_seed_world_pair
    lower_rule: strictly_greater_than_negative_margin
    upper_rule: strictly_less_than_positive_margin
    boundary_equality: does_not_support_equivalence
  fixed_checkpoint_aulc:
    enabled: true
    role: required_secondary_trajectory_evidence
    second_primary: false
    optimizer_steps:
      - 1358
      - 3396
      - 6791
      - 10187
      - 13582
    all_steps_required_for_every_arm_and_seed: true
    interpolation: none
    integral: right_step
  terminal_status_requires:
    paired_bundles: 10
    all_validity_and_evaluation_evidence: true
  conclusion_scope:
    supports_effect_at_n10: primary_omnibus_only
    requires_all_validity_and_guardrail_gates: true
    family_specific_secondary_contrasts_are_not_primary: true
  effect_direction_may_not_change_continuation: true

