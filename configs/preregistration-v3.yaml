      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
  precommit_before_any_outcome_inspection: true
  continue_all_pairs_regardless_of_effect: true
  continuation_may_stop_only_for:
    - measured_preregistered_validity_failure
    - infrastructure_failure
  training:
    nominal_tokens_per_parameter: 20
    targets_per_update: 524288
    optimizer_steps: 13582
    raw_target_tokens: 7120879616
  matched_pair_invariants:
    - model_architecture
    - parameters
    - initialization
    - data_seed
    - raw_target_tokens
    - token_bytes
    - token_order
    - packing_boundaries
    - optimizer
    - optimizer_schedule
    - targets_per_update
    - training_steps
    - inference_budget
    - evaluation_items
    - exact_graph_memory
  claim_bearing_difference: direct_target_weights_on_routed_factual_payloads
  memory:
    kind: exact_non_trainable_graph
    identical_between_arms: true
    byte_identity_required: true
    answer_or_proof_generation_forbidden: true
  aws_topology:
    instance_type: p5.48xlarge
    instances: 1
    accelerator: NVIDIA H100 80GB
    total_gpus: 8
    dense_training_gpus:
      - 0
      - 1
      - 2
      - 3
    split90_training_gpus:
      - 4
      - 5
      - 6
      - 7
    train_groups:
      - 4
      - 4
    symmetric_training: true
    purchase_model: on_demand
  extra_trained_control_arms: []
  terminal_evidence:
    paired_bundles_required: 10
    all_validity_and_evaluation_evidence_required: true

